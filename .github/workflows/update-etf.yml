name: Update ETF Market Data

on:
  schedule:
    # 北京时间周一至周五 21:30（UTC 13:30），收盘净值与估值数据均已发布
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas

      - name: Fetch & compute ETF data
        run: python scripts/update_etf_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_latest.json data/etf_latest.js
          if git diff --cached --quiet; then
            echo "数据无变化（非交易日或接口均失败），跳过提交"
            exit 0
          fi
          git commit -m "[chore] update periodic ETF market data"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
